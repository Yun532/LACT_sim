# MODTRAN total optical-depth atmosphere for a 4.4 km site.
#
# The tau table stores tau_total(lambda, H1 -> H2=4.4 km, zenith=0 deg).
# At runtime transmission is T=exp(-tau), with an optional secant correction
# for small/moderate slant angles.
model=modtran_tau
tau_table=../atmosphere/atm_trans_4400_1_10_0_0_4400.dat
ground_altitude_km=4.4
slant_correction=secant
min_cos_theta=0.2
large_angle_behavior=clamp
out_of_range=clamp
invalid_tau=opaque
missing_emission_altitude=error
