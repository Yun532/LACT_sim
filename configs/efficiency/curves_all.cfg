# Wavelength-dependent efficiency model.
# Input CSV columns: wavelength_nm, efficiency.
# DM0113 curve: arithmetic mean of 13 measured mirror positions.
mirror_reflectivity=configs/efficiency/mirror_reflectivity_dm0113_13point_mean.csv
filter_transmission=configs/efficiency/filter_transmission.csv

# SiPM PDE lives in configs/sipm/new_camera_sipm.cfg as sipm.pde.
# Keeping it there avoids a second photon-to-p.e. conversion path.

# Reserved for later atmospheric transmission curves.
# atmosphere_transmission=configs/efficiency/atmosphere_transmission.csv

# Disabled by default for pure output-plane studies.
funnel_acceptance=false
constant_scale=1
