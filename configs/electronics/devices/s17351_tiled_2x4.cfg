# Fixed S17351 2 x 4 channel device geometry.
# Redundant totals (8 channels, 33792 cells/channel, 528 x 512 logical grid,
# 13.4 x 13.4 mm sensor envelope) are derived and validated by LACT_sim.
layout=s17351_tiled_2x4

channel_columns=2
channel_rows=4
channel_size_x_m=0.0066
channel_size_y_m=0.0032
channel_gap_x_m=0.0002
channel_gap_y_m=0.0002

microcell_columns_per_channel=264
microcell_rows_per_channel=128
