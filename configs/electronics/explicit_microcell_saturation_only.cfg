# Production SiPM electronics stage used by the current camera examples.
#
# Input: one detected primary p.e. after optics, collector and SiPM PDE.
# Output: fired-cell-equivalent p.e. after explicit no-recovery saturation.
# No single-p.e. pulse, voltage waveform or sampled waveform is generated.
n_pixels=1664
input.pixel_id_base=0
enabled=true

microcell.enabled=true
microcell.saturation_enabled=true
microcell.model=explicit_no_recovery
microcell.layout=s17351_tiled_2x4
microcell.sensor_size_x_m=0.0134
microcell.sensor_size_y_m=0.0134
microcell.grid_columns=528
microcell.grid_rows=512
microcell.channels_per_pixel=8
microcell.microcells_per_channel=33792
microcell.channel_columns=2
microcell.channel_rows=4
microcell.channel_size_x_m=0.0066
microcell.channel_size_y_m=0.0032
microcell.channel_gap_x_m=0.0002
microcell.channel_gap_y_m=0.0002
microcell.microcell_columns_per_channel=264
microcell.microcell_rows_per_channel=128

# Datasheet PDE is treated as a full-package efficiency. The code conditions
# it on channel area, then applies the explicit 0.2 mm inter-channel gaps.
# Internal microcell fill factor is not applied again.
microcell.pde_includes_inter_channel_gaps=true

# Saturation-only stage: no pulse convolution and no channel waveforms.
single_pe.enabled=false

# This grid is used only by the p.e.-count trigger. It is not waveform output.
sampling.width_ns=4.0
sampling.start_ns=-20.0
sampling.end_ns=100.0

# Keep production output compact. Integrated primary/fired components are
# controlled independently by each ROOT/HDF5 writer configuration.
output.save_channel_waveforms=false
output.save_primary_sequence=false
output.save_fired_sequence=false
output.save_microcell_decisions=false
