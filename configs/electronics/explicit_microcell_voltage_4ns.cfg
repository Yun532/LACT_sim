n_pixels=1664
input.pixel_id_base=0
pipeline.enabled=true

microcell.enabled=true
microcell.model=explicit_no_recovery
microcell.layout=uniform_interleaved
microcell.sensor_size_x_m=0.0130
microcell.sensor_size_y_m=0.0130
microcell.grid_columns=528
microcell.grid_rows=512
microcell.channels_per_pixel=8
microcell.microcells_per_channel=33792

# This analytic validation template has an explicit mV amplitude scale.
# Replace it with a calibrated measured_csv template for production.
single_pe.enabled=true
single_pe.model=analytic
single_pe.unit=mV
single_pe.rise_ns=1.0
single_pe.fall_ns=6.0
single_pe.support_ns=60.0
single_pe.amplitude_scale=10.0

sampling.width_ns=4.0
sampling.start_ns=-20.0
sampling.end_ns=100.0

output.save_channel_waveforms=true
output.save_primary_sequence=false
output.save_fired_sequence=false
output.save_microcell_decisions=false
