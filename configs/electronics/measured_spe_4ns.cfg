# Measured single-p.e. waveform configuration.
# Input is one detected primary p.e. after optics, collector and SiPM PDE.
n_pixels=1664
input.pixel_id_base=0
enabled=true
random_seed=20260810

# Explicit S17351 cells, one fire per cell, no recovery.
microcell.enabled=true
microcell.device=devices/s17351_tiled_2x4.cfg
microcell.saturation_enabled=true
microcell.model=explicit_no_recovery
microcell.recovery_enabled=false

# The supplied PDE is treated as a full-package average. Internal microcell
# fill factor is not applied again. The explicit channel-gap geometry is kept.
microcell.pde_includes_inter_channel_gaps=true

# Peak-aligned template derived from 537 clean measured single-p.e. pulses.
single_pe.enabled=true
single_pe.model=measured_csv
single_pe.template=parameters/spe_template_measured.csv
single_pe.template_time_reference=peak
single_pe.unit=mV
single_pe.support_ns=180.0
single_pe.amplitude_scale=1.0

# Empirical single-p.e. charge factors; the loader renormalizes them to an
# exact mean of one so the mean calibration remains 84.0349557 mV ns / p.e.
single_pe.charge_fluctuation.enabled=true
single_pe.charge_fluctuation.model=empirical
single_pe.charge_fluctuation.samples=parameters/spe_charge_samples_measured.csv
single_pe.charge_fluctuation.csv_column=charge_factor_mean_one

# No independent intrinsic SiPM timing-jitter measurement is available.
single_pe.time_jitter.enabled=false
single_pe.time_jitter.model=gaussian
single_pe.time_jitter.sigma_ns=0.0

# Full measured-template support around the peak-aligned optical arrival time.
sampling.width_ns=4.0
sampling.start_ns=-40.0
sampling.end_ns=220.0

# Compact production defaults. Validation configs can override these fields.
output.save_channel_waveforms=false
output.save_primary_sequence=false
output.save_fired_sequence=false
output.save_microcell_decisions=false
