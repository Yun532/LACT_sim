# Reproducible coordinate-system example: one CORSIKA shower traced by a
# telescope pointing toward magnetic North (az=0 deg), elevation=70 deg.
telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/whiteboard_f8.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.eventio_reference_z_m=-16
source.missing_wavelength_model=cherenkov
source.max_shower_events=1

propagation.speed_of_light_m_per_ns=0.299792458
output.format=csv
output.hits_csv=run_logs/coordinate_example/corsika_north_whiteboard_hits.csv
output.summary_csv=run_logs/coordinate_example/corsika_north_summary.csv
