# Coordinate diagnostic companion run for an actual camera image.  Pointing is
# copied verbatim from shower event 1 in the bundled CORSIKA example metadata:
# azimuth North->East = 300.027133 deg, altitude = 88.282787 deg.
telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=300.027133
telescope.pointing_el_deg=88.282787
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
camera.collector=none
sipm.config=../sipm/ideal_sipm.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/disabled.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=../muon_E100_th0_run000001.zst
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.eventio_reference_z_m=-16
source.missing_wavelength_model=cherenkov
source.max_shower_events=1

propagation.speed_of_light_m_per_ns=0.299792458
output.format=csv
output.pixel_csv=run_logs/coordinate_example/corsika_aligned_camera_pixels.csv
output.summary_csv=run_logs/coordinate_example/corsika_aligned_camera_summary.csv
