# Current source with the integrated electronics pipeline enabled, but without
# single-p.e. waveform generation.  This isolates the primary-p.e. and
# microcell-occupancy stages for comparison with the pre-electronics baseline.

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/explicit_microcell_voltage_4ns.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
trigger.config=../trigger/disabled.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.missing_wavelength_model=cherenkov
source.max_shower_events=20
source.filter_event_ids=1909

propagation.speed_of_light_m_per_ns=0.299792458
response.mode=stochastic_pe
response.seed=1357913579

electronics.enabled=true
electronics.microcell.enabled=true
electronics.microcell.saturation_enabled=true
electronics.microcell.pde_includes_inter_channel_gaps=true
electronics.single_pe.enabled=false
electronics.output.save_primary_sequence=false
electronics.output.save_fired_sequence=false
electronics.output.save_microcell_decisions=false
nsb.enabled=false

output.format=csv
output.pixel_csv=validation/electronics_chain_v2/validation_outputs/current_electronics_saturation_comparison/camera_pixels.csv
output.summary_csv=validation/electronics_chain_v2/validation_outputs/current_electronics_saturation_comparison/trace_summary.csv
output.save_only_triggered=false
output.lact_root_enabled=true
output.lact_root_path=validation/electronics_chain_v2/validation_outputs/current_electronics_saturation_comparison/lact_events.root
output.lact_profile=image_pe
output.lact_root_write_components=true
output.lact_root_auto_flush_mb=100
output.lact_root_flush_events=1

waveform.enabled=false
collector.debug_photon_output=false
