# End-to-end validation: EventIO gamma -> optics -> real collector -> PDE ->
# explicit no-recovery microcells -> analytic single-p.e. pulse -> 4 ns samples.
# The command-line EventIO path overrides source.eventio_path.

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/explicit_microcell_voltage_4ns.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
trigger.config=../trigger/camera_voltage_array_off.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.missing_wavelength_model=cherenkov
source.max_shower_events=20
source.filter_event_ids=1909

propagation.speed_of_light_m_per_ns=0.299792458
response.mode=stochastic_pe
response.seed=1357913579

# Validation only: preserve every stage for the diagnostic notebook.
# Production defaults are false to avoid a large output-size increase.
electronics.output.save_primary_sequence=true
electronics.output.save_fired_sequence=true
electronics.output.save_microcell_decisions=true

# Keep this validation Cherenkov-only. Standalone NSB is validated separately.
nsb.enabled=false

output.format=csv
output.pixel_csv=validation/electronics_chain_v2/validation_outputs/gamma_e2e/camera_pixels.csv
output.summary_csv=validation/electronics_chain_v2/validation_outputs/gamma_e2e/trace_summary.csv
output.save_only_triggered=false

output.lact_root_enabled=true
output.lact_root_path=validation/electronics_chain_v2/validation_outputs/gamma_e2e/lact_events.root
output.lact_profile=timeseries_pe
output.lact_root_write_components=true
output.lact_root_auto_flush_mb=100
output.lact_root_flush_events=1

waveform.enabled=true
waveform.source=electronics
waveform.time_reference=image_first
waveform.time_bin_width_ns=4
waveform.time_window_start_ns=-20
waveform.time_window_end_ns=100

collector.debug_photon_output=false
