# CORSIKA/EventIO production trace with measured single-p.e. electronics.
#
# Physics chain:
#   EventIO Cherenkov photons -> optics/collector/PDE -> explicit S17351
#   microcell saturation -> measured single-p.e. charge and pulse -> 4 ns mV
#   samples -> voltage multiplicity trigger -> LACT ROOT for pyLAST.
#
# Run from the repository root:
#   ./build/run_corsika_trace \
#     configs/examples/corsika_lact_pylast_root_only_measured_waveform.cfg \
#     /path/to/input.zst \
#     -C output.lact_root_path=/path/to/lact_events.root

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
# Set to 90 - CORSIKA zenith_deg for each production set.
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera_1664.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/measured_spe_4ns.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
nsb.config=../nsb/spectral_skycalc_dark_with_obstruction.cfg
trigger.config=../trigger/camera_voltage_array_off.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.missing_wavelength_model=cherenkov
source.max_shower_events=-1

propagation.speed_of_light_m_per_ns=0.299792458

# The spectral dark-sky NSB model is included above. NSB primary p.e. hits are
# generated beyond both sampling edges by the measured pulse support, so the
# stored waveform has no artificial NSB turn-on/turn-off at its boundaries.
# Only hits in [-40, 220) ns contribute to the integrated NSB truth image.
nsb.enabled=true

waveform.enabled=true
waveform.source=electronics
waveform.time_reference=image_first
waveform.time_bin_width_ns=4
waveform.time_window_start_ns=-40
waveform.time_window_end_ns=220

# Voltage trigger on the sampled waveform. The measured template's maximum
# peak-aligned 4 ns bin is 2.40846415622801 mV per mean p.e.; therefore this
# threshold is the mean 8-p.e. equivalent. Charge fluctuation and arrival-time
# phase make it a physical voltage threshold, not an exact eventwise p.e. cut.
trigger.camera.mode=voltage
trigger.camera.pixel_threshold_mv=19.2677132498241
trigger.camera.multiplicity=3
trigger.camera.coincidence_window_ns=20
trigger.array.enabled=false

# Production output: ROOT only and discard telescopes that fail the camera
# trigger. Compact electronics defaults avoid diagnostic hit/cell sequences.
output.format=root
output.save_only_triggered=true
output.lact_root_enabled=true
output.lact_root_path=run_logs/lact_pylast_measured_waveform/lact_events.root
output.lact_profile=timeseries_pe
output.lact_root_write_components=false
output.lact_root_auto_flush_mb=200
output.lact_root_flush_events=20

collector.debug_photon_output=false
