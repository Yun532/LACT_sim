# CORSIKA/EventIO production trace with explicit SiPM microcell saturation.
#
# This is the compact, Cherenkov-only baseline for pyLAST studies:
#   EventIO photons -> optics/collector/PDE -> explicit S17351 microcells
#   -> p.e.-count trigger -> integrated p.e. image in LACT ROOT.
# No NSB or single-p.e. waveform is generated.
#
# Run from the repository root:
#   ./build/run_corsika_trace \
#     configs/examples/corsika_lact_pylast_root_only_microcell_no_nsb.cfg \
#     /path/to/input.zst \
#     -C output.lact_root_path=/path/to/lact_events.root

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
# Set to 90 - CORSIKA zenith_deg for each production set.
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera_1664.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/explicit_microcell_saturation_only.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/camera_pe_count_array_off.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.missing_wavelength_model=cherenkov
source.max_shower_events=-1

propagation.speed_of_light_m_per_ns=0.299792458

# Cherenkov-only detector output. This explicit override keeps the intent clear
# even if a different NSB component cfg is selected later with -C.
nsb.enabled=false

# Explicit microcell saturation remains enabled by electronics.config, but no
# voltage pulse or sampled waveform is produced.
waveform.enabled=false
# The electronics sampling grid is still used by the p.e.-count trigger even
# when no waveform is serialized.  Anchor it independently for each telescope
# at that camera's first Cherenkov p.e.; serialized peak/trigger times are
# converted back to the absolute EventIO time coordinate.
waveform.time_reference=image_first

# Match the production p.e.-count camera trigger: at least three pixels reach
# 10 fired p.e. in the same trailing 20 ns window. Array trigger stays off.
trigger.camera.mode=pe_count
trigger.camera.pixel_threshold_pe=10
trigger.camera.multiplicity=3
trigger.camera.coincidence_window_ns=20
trigger.array.enabled=false
# Array selection remains disabled, but retain the per-telescope plane-wave
# delay for timing diagnostics and future array-coincidence studies.
trigger.array.time_correction=plane_wave

# ROOT contains the post-saturation integrated p.e. image read directly as
# pyLAST DL0. Keep every telescope with a non-empty final camera image,
# including telescopes below the camera-trigger threshold; all-zero cameras
# are omitted. The trigger decision remains available in observations.triggered.
output.format=root
output.save_only_triggered=false
output.lact_root_enabled=true
output.lact_root_path=run_logs/lact_pylast_microcell_no_nsb/lact_events.root
output.lact_profile=image_pe
output.lact_root_write_components=false
output.lact_root_auto_flush_mb=200
output.lact_root_flush_events=20

collector.debug_photon_output=false
