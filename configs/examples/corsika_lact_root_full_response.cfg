# CORSIKA/EventIO full-response real-camera trace with LACT ROOT output.
#
# This is the pylast-oriented version of:
#   configs/official_tests/corsika_full_response_camera.cfg
#
# It keeps the latest full-response detector chain, uses the LACT2 20260622
# measured-constrained optics, and writes a lact_event_root_v1 file for
# pylast.io.LactEventSource and pylast.visualize.
#
# Includes:
#   - elevation-dependent mirror structural deformation
#   - measured per-facet curvature radii
#   - fixed per-facet pointing offsets fitted jointly at 11 elevations
#   - calibrated global reflection-direction roughness
#   - mirror reflectivity, filter transmission, and SiPM PDE curves
#   - new_camera pixel layout and Bezier square-cone light collector
#   - final telescope structure obstruction on incoming/reflected rays
#   - simple multiplicity trigger
#
# NSB is enabled with the dark-sky SkyCalc LoNS model and the obstruction
# effective area used by the official full-response tests.
#
# Run from repository root:
#   ./build/run_corsika_trace \
#     configs/examples/corsika_lact_root_full_response.cfg \
#     /path/to/input.simtel.zst

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
# Set to 90 - CORSIKA zenith_deg for each production set.
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera_1656.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/explicit_microcell_saturation_only.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
nsb.config=../nsb/spectral_skycalc_dark_with_obstruction.cfg
trigger.config=../trigger/example_simple_multiplicity.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.missing_wavelength_model=cherenkov

# Process all shower events by default. Set to a positive number for smoke tests.
source.max_shower_events=-1

propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/lact_root_full_response/corsika_trace.h5
output.hdf5_storage=dense
output.hdf5_write_components=false
output.hdf5_write_waveforms=false
output.write_pixel_time_stats=true
output.summary_csv=run_logs/lact_root_full_response/corsika_trace_summary.csv

output.save_only_triggered=true

output.lact_root_enabled=true
output.lact_root_path=run_logs/lact_root_full_response/lact_events.root
output.lact_profile=image_pe
# Always writes observations.image_cherenkov_pe for pylast simulation.true_image.
# Set true to also write optional ROOT component diagnostics such as image_nsb_pe.
output.lact_root_write_components=false
output.lact_root_auto_flush_mb=200
output.lact_root_flush_events=20

# Integrated fired-cell-equivalent p.e. image only; explicit SiPM microcell
# saturation remains enabled above.
waveform.enabled=false

# Official full-response trigger setting.
trigger.pixel_threshold_pe=10
trigger.camera_coincidence_window_ns=20
trigger.array_coincidence_window_ns=0

collector.debug_photon_output=false
