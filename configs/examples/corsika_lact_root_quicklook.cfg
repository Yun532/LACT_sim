# CORSIKA/EventIO -> LACT camera -> pylast-oriented ROOT quick-look output.
#
# Run from repository root:
#   ./build/run_corsika_trace \
#     configs/examples/corsika_lact_root_quicklook.cfg \
#     /path/to/input.simtel.zst
#
# Then inspect:
#   python/plot_lact_root_output.py \
#     run_logs/lact_root_quicklook/lact_events.root \
#     --outdir run_logs/lact_root_quicklook/root_quicklook

telescope.id=0
telescope.name=LACT_1229_root_quicklook
telescope.position_m=0,0,0
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
telescope.focal_length_m=8
telescope.coordinate_system=array

mirror.mode=csv
mirror.csv_path=configs/mirror_1229_facets.csv

output.plane_point=0,0,-8
output.plane_normal=0,0,-1
output.plane_u_axis=-1,0,0
output.plane_v_axis=0,1,0

camera.enabled=true
camera.mode=csv
camera.csv_path=configs/cameras/new_camera_pixels.csv
camera.collector=bezier
camera.collector_material=true_reflect
camera.collector_exit_size_m=0.0130
camera.collector_height_m=0.0297

sipm.size_m=0.0130
sipm.pde=configs/efficiency/sipm_pde.csv

atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/spectral_skycalc_dark_no_obstruction.cfg
trigger.config=../trigger/disabled.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.missing_wavelength_model=cherenkov

# Keep this small for first server validation. Remove or increase for production.
source.max_shower_events=1

propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/lact_root_quicklook/corsika_trace.h5
output.hdf5_storage=dense
output.write_pixel_time_stats=true
output.summary_csv=run_logs/lact_root_quicklook/corsika_trace_summary.csv

output.lact_root_enabled=true
output.lact_root_path=run_logs/lact_root_quicklook/lact_events.root
output.lact_profile=timeseries_pe
output.lact_root_write_components=false
output.lact_root_auto_flush_mb=200
output.lact_root_flush_events=20

waveform.enabled=true
waveform.source=pe
waveform.time_reference=image_first
waveform.time_bin_width_ns=2
waveform.time_window_start_ns=-2
waveform.time_window_end_ns=60

trigger.pixel_threshold_pe=10
trigger.camera_coincidence_window_ns=20
trigger.array_coincidence_window_ns=0

collector.debug_photon_output=false
