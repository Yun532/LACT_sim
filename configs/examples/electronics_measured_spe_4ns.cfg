# Standalone measured-waveform electronics entry point.
# Usage:
#   build/run_camera_electronics \
#     configs/examples/electronics_measured_spe_4ns.cfg \
#     primary_hits.csv run_logs/electronics_measured_spe_4ns
electronics.config=../electronics/measured_spe_4ns.cfg
trigger.config=../trigger/camera_voltage_array_off.cfg

# Validation keeps all truth stages. The production component defaults remain
# compact and can be used without these overrides.
electronics.output.save_primary_sequence=true
electronics.output.save_fired_sequence=true
electronics.output.save_microcell_decisions=true
electronics.output.save_channel_waveforms=true

nsb.enabled=false
waveform.enabled=true
waveform.source=electronics
waveform.time_reference=image_first
waveform.time_bin_width_ns=4
waveform.time_window_start_ns=-40
waveform.time_window_end_ns=220
