# Standalone entry point for the current saturation-only electronics stage.
#
# Run from the repository root:
#   build/run_camera_electronics \
#     configs/examples/electronics_saturation_only.cfg \
#     /path/to/primary_hits.csv \
#     run_logs/electronics_saturation_only
electronics.config=../electronics/explicit_microcell_saturation_only.cfg

# The standalone default isolates saturation. A camera p.e.-count trigger can
# be enabled by including/overriding the trigger keys in a caller config.
trigger.enabled=false
waveform.enabled=false
