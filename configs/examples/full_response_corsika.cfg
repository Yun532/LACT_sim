# CORSIKA/EventIO -> 光追 -> new_camera 像素 p.e. 完整响应示例。
# 本配置包含：结构形变、随机光学误差、镜面反射率、滤光片透过率、
# SiPM PDE、light collector、简单 multiplicity trigger。
#
# 默认会计算 trigger，但 output.save_only_triggered=false，
# 所以未触发事件也会保存，方便用户第一次检查输入、指向和输出。
# 如果只想保存触发事件，把 output.save_only_triggered 改成 true。
#
# NSB 默认关闭。建议先确认无 NSB 版本跑通，再按下面注释示例打开。
#
# 运行命令：
#   build/run_corsika_trace configs/examples/full_response_corsika.cfg /path/to/input.zst
#
# 用户通常只需要修改：
#   1. 命令行里的 /path/to/input.zst
#   2. telescope.pointing_az_deg 和 telescope.pointing_el_deg
#   3. output.* 输出路径
#   4. 如需替换结构，修改 mirror.csv_path 或 camera.csv_path

# 望远镜指向。这里用 zenith=20 deg, azimuth=0 deg，
# 所以 elevation=90-20=70 deg。
telescope.id=0
telescope.name=LACT_1229_full_response_corsika
telescope.position_m=0,0,0
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
telescope.focal_length_m=8
telescope.coordinate_system=array

# 基础镜面布局。单位是 m。
mirror.mode=csv
mirror.csv_path=configs/mirror_1229_facets.csv

# 结构形变和随机光学误差。
# structural_deformation_config 会根据 telescope.pointing_el_deg 使用仰角相关镜片状态。
error.random_seed=987654321
error.structural_deformation_config=configs/mirrors/mirror_1229_elevation_series.cfg
error.facet_radial_position_sigma_m=0.002
error.facet_normal_sigma_deg=0.01
error.reflect_direction_sigma_deg=0.0179
error.radius_of_curvature_sigma_m=0.02
error.reflectivity_scale_sigma=0.02

# 波长相关效率。
# mirror_reflectivity 和 filter_transmission 使用两列 CSV：
# wavelength_nm, efficiency。
efficiency.mirror_reflectivity=configs/efficiency/mirror_reflectivity.csv
efficiency.filter_transmission=configs/efficiency/filter_transmission.csv
efficiency.constant_scale=1
efficiency.funnel_acceptance=false

# 焦平面/相机平面，使用望远镜本地坐标。
output.plane_point=0,0,-8
output.plane_normal=0,0,-1
output.plane_u_axis=1,0,0
output.plane_v_axis=0,1,0

# 真实相机像素布局和 light collector。
camera.enabled=true
camera.mode=csv
camera.csv_path=configs/cameras/new_camera_pixels.csv
camera.collector=bezier
camera.collector_material=true_reflect
camera.collector_exit_size_m=0.0130
camera.collector_height_m=0.0297

# SiPM PDE。若想做理想光子计数，可以注释掉 sipm.pde。
sipm.size_m=0.0130
sipm.pde=configs/efficiency/sipm_pde.csv

# 大气额外透过率。
# 默认关闭，表示不再对 CORSIKA 光子额外乘大气透过率。
# 如果希望使用随高度和波长变化的 MODTRAN tau 表，可把下面三行替换为：
# atmosphere.config=configs/atmosphere/modtran_4400_desert.cfg
# 可选：输出高度分布检查表。
# atmosphere.height_histogram_csv=run_logs/full_response_corsika/atmosphere_height_histogram.csv
atmosphere.transmission=none
atmosphere.refractive_index_model=none
atmosphere.speed_of_light_correction=false

# NSB 默认关闭。若需要加入简单常数 NSB，可取消下面注释并修改参数。
# mean NSB p.e. per pixel = nsb.rate_pe_per_ns_per_pixel * nsb.window_ns。
nsb.enabled=false
nsb.model=constant_rate
nsb.rate_pe_per_ns_per_pixel=0
nsb.window_ns=16
nsb.seed=12345
#
# nsb.enabled=true
# nsb.rate_pe_per_ns_per_pixel=0.05
# nsb.window_ns=16
#
# 若希望从夜天光谱计算 NSB rate，可以使用 spectral_flux：
# nsb.enabled=true
# nsb.model=spectral_flux
# nsb.spectrum_csv=configs/nsb/nsb_spectrum_skycalc_dark.csv
# nsb.spectrum_unit=ph_s_nm_sr_m2
# nsb.effective_area_m2=29.623570
# nsb.pixel_solid_angle=auto
# nsb.window_ns=16
# nsb.seed=12345

# 简单 multiplicity trigger。
# camera trigger: 至少 camera_multiplicity 个像素超过 pixel_threshold_pe。
# array trigger: 同一个 event_id 中至少 array_multiplicity 台望远镜触发。
trigger.enabled=true
trigger.pixel_threshold_pe=10
trigger.camera_multiplicity=3
trigger.array_multiplicity=2
trigger.coincidence_window_ns=50

# CORSIKA/EventIO 输入。eventio_path 通常由命令行第二个参数传入。
source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100

# hessio/CORSIKA IACT photon bunch 坐标约定。
source.eventio_coordinate_frame=corsika_iact
source.use_eventio_telescope_position=true

# EventIO 中如果 photon bunch 的 lambda 为 0 或缺失，按 Cherenkov 近似谱
# dN/dlambda ∝ 1/lambda^2 随机补波长。
# 波长范围默认优先从 CORSIKA input card 的 CWAVLG 行读取。
# 如果输入文件没有 CWAVLG，可手动打开下面三行指定范围和随机种子。
source.missing_wavelength_model=cherenkov
# source.missing_wavelength_min_nm=260
# source.missing_wavelength_max_nm=1000
# source.missing_wavelength_seed=246813579

# 2D EventIO photon bunch 的记录平面设置。
# input_plane_z_m 是望远镜本地坐标里的记录平面 z，默认 0。
# plane_mode=auto 会自动判断应该向前追迹还是沿直线回投到镜面。
# 可选值：auto / forward / backproject。
source.eventio_2d_input_plane_z_m=0
source.eventio_2d_plane_mode=auto

# Expand each EventIO bunch into independent photon trials so wavelength,
# survival and camera landing fluctuations remain discrete.
response.mode=stochastic_pe
response.seed=246813579

# 普通 CORSIKA 示例默认处理前 10 个 shower。
source.max_shower_events=10
# source.filter_shower_event_id=327666

# 输出文件。正式相机响应建议使用 HDF5；调试时可以改成 csv 或 both。
output.format=hdf5
output.hdf5_path=run_logs/full_response_corsika/corsika_trace.h5
output.hdf5_storage=dense
output.hdf5_waveform_storage=sparse
output.hdf5_write_components=false
output.save_only_triggered=false
output.pixel_csv=run_logs/full_response_corsika/camera_pixel_image.csv
output.summary_csv=run_logs/full_response_corsika/corsika_trace_summary.csv

propagation.speed_of_light_m_per_ns=0.299792458

# PE arrival-time proxy used by the time-coincidence trigger. This remains the
# optical/electronics boundary and can later feed the full electronics model.
waveform.enabled=true
waveform.source=pe
waveform.time_reference=image_first
waveform.time_bin_width_ns=1
waveform.time_window_start_ns=-10
waveform.time_window_end_ns=80
