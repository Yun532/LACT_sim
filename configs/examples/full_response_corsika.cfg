# 示例 3：CORSIKA/EventIO -> 完整相机响应 -> HDF5
# 运行：build/run_corsika_trace configs/examples/full_response_corsika.cfg /path/to/input.zst
# pointing_el_deg 必须设置为 90 - CORSIKA zenith_deg。

telescope.pointing_az_deg=0
telescope.pointing_el_deg=90

# LACT2 20260622 实测镜面：形变、逐镜固定偏差和曲率半径已在 CSV 中。
mirror.mode=elevation_series
mirror.series_format=facet_csv
mirror.series_csv_path=configs/calibrated/lact2_measured_20260622/mirror_elevation_series_20260622.csv
mirror.surface_type=Spherical
mirror.aperture_shape=Hexagon
mirror.size1=0.8
error.random_seed=987654321
error.reflect_direction_sigma_deg=0.00725416907642

output.plane_point=0,0,-8
output.plane_normal=0,0,-1
output.plane_u_axis=1,0,0
output.plane_v_axis=0,1,0

camera.enabled=true
camera.mode=csv
camera.csv_path=configs/cameras/new_camera_pixels.csv
camera.collector=bezier
camera.collector_material=true_reflect
camera.collector_exit_size_m=0.0130
camera.collector_height_m=0.0297
sipm.size_m=0.0130
sipm.pde=configs/efficiency/sipm_pde.csv

efficiency.mirror_reflectivity=configs/efficiency/mirror_reflectivity_dm0113_13point_mean.csv
efficiency.filter_transmission=configs/efficiency/filter_transmission.csv

atmosphere.model=modtran_tau
atmosphere.tau_table=configs/atmosphere/atm_trans_4400_1_10_0_0_4400.dat
atmosphere.table_reference_altitude_km=4.4
atmosphere.detector_altitude_km=4.4
atmosphere.slant_correction=secant
atmosphere.min_cos_theta=0.2
atmosphere.large_angle_behavior=clamp
atmosphere.out_of_range=clamp
atmosphere.invalid_tau=opaque
atmosphere.missing_emission_altitude=error

obstruction.enabled=true
obstruction.mode=primitives
obstruction.primitives_csv=configs/obstructions/raytrace_final_structure_primitives.csv
obstruction.check_incoming=true
obstruction.check_reflected=true

# 首次检查默认不开 NSB、保存未触发事件，确保总能检查输入和相机图。
nsb.enabled=false
trigger.enabled=true
trigger.pixel_threshold_pe=10
trigger.camera_multiplicity=3
trigger.array_multiplicity=2
trigger.camera_coincidence_window_ns=20
trigger.array_coincidence_window_ns=0

source.mode=EventIO
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.eventio_reference_z_m=-16
source.eventio_2d_plane_mode=auto
source.missing_wavelength_model=cherenkov
source.max_shower_events=10

response.mode=stochastic_pe
response.seed=246813579

output.format=hdf5
output.hdf5_path=run_logs/full_response_corsika/corsika_trace.h5
output.hdf5_storage=dense
output.hdf5_waveform_storage=sparse
output.hdf5_write_components=false
output.save_only_triggered=false

waveform.enabled=true
waveform.source=pe
waveform.time_reference=image_first
waveform.time_bin_width_ns=1
waveform.time_window_start_ns=-10
waveform.time_window_end_ns=80
