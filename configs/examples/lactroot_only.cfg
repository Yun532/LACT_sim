# CORSIKA/EventIO 生产默认配置，只输出 LACT ROOT。
# 光学部分使用 LACT2 20260622 实测约束参数；适合批量模拟并由 pyLAST 读取。
#
# 运行：
#   build/run_corsika_trace configs/examples/lactroot_only.cfg /path/to/input.zst
#
# 默认输出：
#   run_logs/lactroot_only/lact_events.root

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
# 每批数据必须设为 90 - CORSIKA zenith_deg；该值也用于选择/插值支架形变。
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
nsb.config=../nsb/spectral_skycalc_dark_with_obstruction.cfg
trigger.config=../trigger/example_simple_multiplicity.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.missing_wavelength_model=cherenkov
# LACT ROOT 正式输出默认处理输入文件中的全部 shower。
source.max_shower_events=-1

propagation.speed_of_light_m_per_ns=0.299792458

# 只写 ROOT，不写 HDF5/CSV。
output.format=root
output.lact_root_enabled=true
output.lact_root_path=run_logs/lactroot_only/lact_events.root
output.lact_profile=timeseries_pe
output.lact_root_write_components=false
output.lact_root_auto_flush_mb=200
output.lact_root_flush_events=20

# 只保存通过 trigger 的望远镜事件，直接供 pylast R1 workflow 使用。
output.save_only_triggered=true

# 写入可供 pylast R1 workflow 使用的稀疏 p.e. waveform。
waveform.enabled=true
waveform.source=pe
waveform.time_reference=image_first
waveform.time_bin_width_ns=2
waveform.time_window_start_ns=-2
waveform.time_window_end_ns=60

trigger.pixel_threshold_pe=10
trigger.coincidence_window_ns=10

collector.debug_photon_output=false
