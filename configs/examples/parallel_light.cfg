# 平行光白板测试示例。
# 运行命令：
#   build/run_optical_sim configs/examples/parallel_light.cfg

# 望远镜指向。elevation=90 deg 表示望远镜竖直指向天顶。
telescope.id=0
telescope.name=LACT_1229_parallel_light
telescope.position_m=0,0,0
telescope.coordinate_system=array
telescope.pointing_az_deg=0
telescope.pointing_el_deg=90
telescope.focal_length_m=8.0

# 镜面布局。csv_path 指向 1229 面镜片布局。
mirror.mode=csv
mirror.csv_path=configs/mirror_1229_facets.csv

# 合成光源。默认是一束沿望远镜光轴入射的理想平行光。
source.mode=ParallelBeam
source.coordinate_frame=telescope_local
source.n_bunches=1000000
source.multiplicity=1
source.wavelength_nm=400
source.time_ns=0
source.photon_weight=1
source.source_plane_z=1
source.beam_radius_m=4
source.beam_direction=0,0,-1
source.random_seed=1229

# 如果想把这个例子改成 50 m 处的轴上点源，可以把上面的 source.*
# 改成下面这一组参数。点源在望远镜本地 +z 方向，光子采样目标平面为 z=0。
#
# source.mode=PointSource
# source.n_bunches=1000000
# source.multiplicity=1
# source.wavelength_nm=400
# source.time_ns=0
# source.photon_weight=1
# source.source_position=0,0,50
# source.aperture_z=0
# source.aperture_radius_m=4
# source.random_seed=50

# f=8 m 的焦平面白板。
output.plane_point=0,0,-8
output.plane_normal=0,0,-1
output.plane_u_axis=1,0,0
output.plane_v_axis=0,1,0
output.csv=run_logs/parallel_light/hits.csv
# 如需在输出末尾保存实际进入光追的本地位置和方向，可打开：
# output.whiteboard_input_photon=true

propagation.speed_of_light_m_per_ns=0.299792458
