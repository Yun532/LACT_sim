# Event 1909 / telescope 19 shell with Cherenkov efficiency forced to zero.
# The output therefore contains measured-electronics NSB only.
telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.id=19
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera_1656.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/measured_spe_4ns.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/ideal.cfg
trigger.config=../trigger/camera_voltage_array_off.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg

source.mode=PhotonCsv
source.csv_path=configs/sources/event1909_tel19_minimal_photons.csv
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=false
source.eventio_2d=true
source.wavelength_nm=400
source.missing_wavelength_model=constant
source.multiplicity=1
source.photon_weight=1
source.event_id=1909
source.telescope_id=19
source.event_id_mode=event

response.mode=stochastic_pe
response.seed=1909
efficiency.constant_scale=0
nsb.enabled=true
nsb.model=constant_rate
nsb.rate_pe_per_ns_per_pixel=0.02
nsb.window_ns=32
nsb.seed=20260811

electronics.output.save_primary_sequence=true
electronics.output.save_fired_sequence=true
electronics.output.save_microcell_decisions=false
waveform.enabled=true
waveform.source=electronics
waveform.time_reference=image_first
waveform.time_bin_width_ns=4
waveform.time_window_start_ns=-40
waveform.time_window_end_ns=220
propagation.speed_of_light_m_per_ns=0.299792458

output.format=both
output.pixel_csv=validation/measured_electronics/nsb_only/camera_pixels.csv
output.summary_csv=validation/measured_electronics/nsb_only/trace_summary.csv
output.waveform_csv=validation/measured_electronics/nsb_only/waveforms.csv
output.trigger_csv=validation/measured_electronics/nsb_only/triggers.csv
output.primary_pe_csv=validation/measured_electronics/nsb_only/primary_pe.csv
output.fired_pe_csv=validation/measured_electronics/nsb_only/fired_pe.csv
output.hdf5_path=validation/measured_electronics/nsb_only/lact_events.h5
output.hdf5_storage=both
output.hdf5_waveform_storage=sparse
output.hdf5_write_components=true
output.hdf5_write_waveforms=true
output.save_only_triggered=false
output.lact_root_enabled=true
output.lact_root_path=validation/measured_electronics/nsb_only/lact_events.root
output.lact_profile=timeseries_pe
output.lact_root_write_components=true
