# Minimal user PhotonCsv -> pure optics whiteboard + ideal photon-count camera.
#
# The input CSV needs only:
#   x_m,y_m,z_m,dir_x,dir_y,dir_z
# One row means one photon. Wavelength and time are omitted because all
# wavelength-dependent efficiencies and waveform processing are disabled.

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/whiteboard_f8.cfg
camera.config=../cameras/new_camera.cfg
camera.collector=none
sipm.config=../sipm/ideal_sipm.cfg
electronics.config=../electronics/ideal_pe.cfg
efficiency.config=../efficiency/ideal.cfg
atmosphere.config=../atmosphere/ideal.cfg
error.config=../errors/ideal.cfg

source.mode=PhotonCsv
source.csv_path=configs/sources/event1909_tel19_minimal_photons.csv
source.coordinate_frame=corsika_nwu_relative
source.multiplicity=1
source.photon_weight=1
source.event_id=1909
source.telescope_id=19

propagation.speed_of_light_m_per_ns=0.299792458

output.mode=both
output.csv=run_logs/examples/photon_csv_minimal/whiteboard_hits.csv
output.pixel_csv=run_logs/examples/photon_csv_minimal/camera_photon_counts.csv
