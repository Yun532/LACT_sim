# Event 1909 / telescope 19: explicit S17351 no-recovery saturation, no waveform.
telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.id=19
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera_1664.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/explicit_microcell_saturation_only.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/ideal.cfg
trigger.config=../trigger/camera_pe_count_array_off.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg

source.mode=PhotonCsv
source.csv_path=configs/sources/event1909_tel19_minimal_photons.csv
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=false
source.eventio_2d=true
source.wavelength_nm=400
source.missing_wavelength_model=constant
source.multiplicity=1
source.photon_weight=1
source.event_id=1909
source.telescope_id=19
source.event_id_mode=event

response.mode=stochastic_pe
response.seed=1909
nsb.enabled=false
electronics.output.save_primary_sequence=true
electronics.output.save_fired_sequence=true
electronics.output.save_microcell_decisions=false
waveform.enabled=false
propagation.speed_of_light_m_per_ns=0.299792458

output.format=both
output.pixel_csv=validation/measured_electronics/saturation_on_waveform_off/camera_pixels.csv
output.summary_csv=validation/measured_electronics/saturation_on_waveform_off/trace_summary.csv
output.trigger_csv=validation/measured_electronics/saturation_on_waveform_off/triggers.csv
output.primary_pe_csv=validation/measured_electronics/saturation_on_waveform_off/primary_pe.csv
output.fired_pe_csv=validation/measured_electronics/saturation_on_waveform_off/fired_pe.csv
output.hdf5_path=validation/measured_electronics/saturation_on_waveform_off/lact_events.h5
output.hdf5_storage=both
output.hdf5_write_components=true
output.hdf5_write_waveforms=false
output.save_only_triggered=false
output.lact_root_enabled=true
output.lact_root_path=validation/measured_electronics/saturation_on_waveform_off/lact_events.root
output.lact_profile=image_pe
output.lact_root_write_components=true
