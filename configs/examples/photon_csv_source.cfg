# 示例 2：Photon CSV -> 完整相机响应 -> LACT ROOT -> pyLAST
# 运行：build/run_corsika_trace configs/examples/photon_csv_source.cfg
# 输入为从 CORSIKA 2D bunch 导出的 event 1909 / telescope 19 六列 CSV。

telescope.id=19
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70

# LACT2 20260622 实测镜面：支架形变、逐镜固定偏差和曲率半径已写入 CSV。
mirror.mode=elevation_series
mirror.series_format=facet_csv
mirror.series_csv_path=configs/calibrated/lact2_measured_20260622/mirror_elevation_series_20260622.csv
mirror.surface_type=Spherical
mirror.aperture_shape=Hexagon
mirror.size1=0.8
error.random_seed=987654321
error.reflect_direction_sigma_deg=0.00725416907642

output.plane_point=0,0,-8
output.plane_normal=0,0,-1
output.plane_u_axis=-1,0,0
output.plane_v_axis=0,1,0

camera.enabled=true
camera.mode=csv
camera.csv_path=configs/cameras/new_camera_pixels_1664.csv
camera.collector=bezier
camera.collector_material=true_reflect
camera.collector_exit_size_m=0.0130
camera.collector_height_m=0.0297
sipm.size_m=0.0130
sipm.pde=configs/efficiency/sipm_pde.csv
electronics.config=../electronics/integrated_sipm_saturation.cfg
efficiency.mirror_reflectivity=configs/efficiency/mirror_reflectivity_dm0113_13point_mean.csv
efficiency.filter_transmission=configs/efficiency/filter_transmission.csv

atmosphere.transmission=none
atmosphere.refractive_index_model=none
atmosphere.speed_of_light_correction=false

source.mode=PhotonCsv
source.csv_path=configs/sources/event1909_tel19_minimal_photons.csv
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=false
source.eventio_2d=true
source.eventio_reference_z_m=-16
source.eventio_2d_plane_mode=auto
source.wavelength_nm=400
source.missing_wavelength_model=constant
source.multiplicity=1
source.photon_weight=1
source.event_id=1909
source.telescope_id=19
source.event_id_mode=event

response.mode=stochastic_pe
response.seed=1909
nsb.enabled=false
trigger.enabled=false
waveform.enabled=false

output.format=root
output.save_only_triggered=false
output.lact_root_enabled=true
output.lact_root_path=run_logs/photon_csv_source/lact_events.root
output.lact_profile=image_pe
output.lact_root_write_components=false
