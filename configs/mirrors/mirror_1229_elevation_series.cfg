# 1229 望远镜仰角相关结构形变配置。
# full_response_corsika.cfg 通过 error.structural_deformation_config 引用本文件。
#
# mode=elevation_series 表示程序会根据当前 telescope.pointing_el_deg，
# 从下面的 consolidated CSV 中插值/选择对应仰角的镜片中心和法向。
mode=elevation_series
series_format=facet_csv
series_csv_path=configs/mirror_1229_elevation_series.csv

# 如果 CSV 中缺少这些列，就使用下面默认镜面参数。
surface_type=Spherical
radius_of_curvature=16.0
aperture_shape=Hexagon
size1=0.8
size2=0.0
aperture_rotation_rad=0.0
