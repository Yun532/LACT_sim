# Example constant-rate NSB model.
# mean NSB p.e. per pixel = rate_pe_per_ns_per_pixel * window_ns.
enabled=true
model=constant_rate
rate_pe_per_ns_per_pixel=0.05
window_ns=16
seed=12345
# The default mean rate is identical for every camera pixel. Use
# spatial_model=pixel_scale plus pixel_scale_csv for a per-pixel rate map.
spatial_model=uniform
