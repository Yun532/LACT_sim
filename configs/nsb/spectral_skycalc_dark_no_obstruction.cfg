# 暗夜 SkyCalc 夜天光谱 NSB 模型，无遮挡等效面积版本。
# 程序会按下面的量计算每个像素每 ns 的平均 p.e.：
#   夜天光谱 * 等效收集面积 * 像素立体角 *
#   mirror reflectivity * filter transmission * SiPM PDE。
enabled=true
model=spectral_flux
spectrum_csv=nsb_spectrum.csv
spectrum_unit=ph_s_nm_sr_m2
effective_area_m2=29.623570
pixel_solid_angle=auto
window_ns=16
seed=12345
