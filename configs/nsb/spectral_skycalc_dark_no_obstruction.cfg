# Dark-sky LoNS spectral NSB model from ESO SkyCalc.
#
# This file computes nsb.rate_pe_per_ns_per_pixel from:
#   LoNS spectrum * fixed optical effective area * pixel solid angle *
#   mirror reflectivity * filter transmission * SiPM PDE.
enabled=true
model=spectral_flux
spectrum_csv=nsb_spectrum.csv
spectrum_unit=ph_s_nm_sr_m2
effective_area_m2=29.623570
# Area-weighted Bezier/true_reflect throughput for the LACT f=8 m, R=3 m
# focal cone. Derived with scan_light_collector_angular_response using 200k
# entrance photons per 0.5 degree point through theta_max=atan(3/8).
collector_mean_transmission=0.923436437
pixel_solid_angle=auto
window_ns=16
seed=12345
