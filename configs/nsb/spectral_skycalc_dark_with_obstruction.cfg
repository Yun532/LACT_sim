# Dark-sky LoNS spectral NSB model from ESO SkyCalc.
#
# Same as spectral_skycalc_dark_no_obstruction.cfg, but uses the fixed
# effective area measured from the official parallel-light obstruction test.
enabled=true
model=spectral_flux
spectrum_csv=nsb_spectrum.csv
spectrum_unit=ph_s_nm_sr_m2
effective_area_m2=24.576860
collector_mean_transmission=0.923436437
pixel_solid_angle=auto
# NSB included in the saved image: [event reference, reference + 32 ns).
window_ns=32
seed=12345
