# Simplified 3D obstruction model for the camera-side support structure.
#
# This is the preferred obstruction input for angle-dependent tests. Unlike the
# old 2D projection mask, these primitives are intersected in 3D, so different
# incoming/reflected ray directions produce different shadows.
#
# Coordinates are LACT telescope-local meters:
#   z=-16 m : mirror side
#   z=-8 m  : focal-plane/camera side
#
# The geometry is intentionally simplified from the CAD view: main camera
# support tubes, cross tubes, a camera frame, and a compact camera-body box.
# Mirror-back truss and mount structures are not included.
enabled=true
mode=primitives
primitives_csv=lact_camera_support_primitives.csv
check_incoming=true
check_reflected=true
