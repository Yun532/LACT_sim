# Perfect-optics CORSIKA/EventIO real-camera trace with MODTRAN atmosphere.
telescope.config=telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
atmosphere.height_histogram_csv=run_logs/official_tests/corsika_atmosphere/atmosphere_height_histogram.csv
atmosphere.histogram_min_altitude_km=4.4
atmosphere.histogram_max_altitude_km=100.0
atmosphere.histogram_bin_width_km=1.0
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/disabled.cfg
source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.missing_wavelength_model=cherenkov
source.max_shower_events=1
propagation.speed_of_light_m_per_ns=0.299792458
output.format=hdf5
output.hdf5_path=run_logs/official_tests/corsika_atmosphere/camera_dense.h5
output.hdf5_storage=dense
output.hdf5_write_components=false
