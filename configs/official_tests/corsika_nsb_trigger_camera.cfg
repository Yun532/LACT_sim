# CORSIKA/EventIO real-camera trace with SkyCalc spectral NSB and multiplicity trigger.
telescope.config=telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/explicit_microcell_saturation_only.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/spectral_skycalc_dark_no_obstruction.cfg
trigger.config=../trigger/camera_pe_count_array_off.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.missing_wavelength_model=cherenkov
source.max_shower_events=10
propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/official_tests/corsika/camera_nsb_trigger_dense.h5
output.hdf5_storage=dense
output.hdf5_write_components=true
output.save_only_triggered=true
output.write_pixel_time_stats=true

# Current production scope: NSB primary p.e. pass through the same explicit
# microcell saturation as Cherenkov p.e.; no pulse or waveform is generated.
waveform.enabled=false

# Official trigger smoke test: save only telescope images that pass this trigger.
trigger.pixel_threshold_pe=10
