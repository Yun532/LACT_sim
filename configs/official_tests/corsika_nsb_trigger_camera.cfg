# CORSIKA/EventIO real-camera trace with simple NSB and multiplicity trigger.
telescope.config=telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/whiteboard_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
electronics.config=../electronics/new_camera_pe.cfg
atmosphere.config=../atmosphere/ideal.cfg
nsb.config=../nsb/example_constant_rate.cfg
trigger.config=../trigger/example_simple_multiplicity.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.eventio_coordinate_frame=corsika_iact
source.wavelength_nm=400
source.time_ns=0
source.photon_weight=1
source.multiplicity=1

propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/official_tests/corsika/camera_nsb_trigger_dense.h5
output.hdf5_storage=dense
output.hdf5_write_components=true
