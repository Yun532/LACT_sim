# Small PhotonCsv run used to verify HDF5 and lact_event ROOT provenance.
telescope.config=telescope_1229_minimal.cfg
mirror.config=../mirrors/mirror_1229_imported.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
camera.collector=none
sipm.config=../sipm/ideal_sipm.cfg
electronics.config=../electronics/ideal_pe.cfg
efficiency.config=../efficiency/ideal.cfg
atmosphere.config=../atmosphere/ideal.cfg
error.config=../errors/ideal.cfg

source.mode=PhotonCsv
source.csv_path=configs/sources/photon_csv_center_test.csv
source.coordinate_frame=telescope_local
source.event_id_mode=event

response.mode=expectation
nsb.enabled=false
trigger.enabled=false
waveform.enabled=false

output.format=hdf5
output.hdf5_path=run_logs/official_tests/provenance/trace.h5
output.hdf5_storage=sparse
output.lact_root_enabled=true
output.lact_root_path=run_logs/official_tests/provenance/lact_events.root
output.lact_profile=image_pe
output.save_only_triggered=false
