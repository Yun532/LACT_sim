# First-shower diagnostic companion to trust_full_muon_1000.cfg.
# It uses the same detector chain but also writes human-readable CSV and
# collector/mirror diagnostics for step-by-step inspection.

telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=90
mirror.config=../calibrated/lact2_measured_20260622/mirror_20260622.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
nsb.config=../nsb/spectral_skycalc_dark_with_obstruction.cfg
trigger.config=../trigger/example_simple_multiplicity.cfg
error.config=../calibrated/lact2_measured_20260622/errors.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.coordinate_frame=corsika_nwu_relative
source.use_eventio_telescope_position=true
source.eventio_reference_z_m=-16
source.missing_wavelength_model=cherenkov
source.max_shower_events=1

propagation.speed_of_light_m_per_ns=0.299792458

output.format=both
output.hdf5_path=run_logs/trust_validation/muon_first_event_canonical_nsb/corsika_trace.h5
output.hdf5_storage=both
output.hdf5_write_components=true
output.hdf5_write_waveforms=true
output.hdf5_waveform_storage=sparse
output.write_pixel_time_stats=true
output.save_only_triggered=false
output.pixel_csv=run_logs/trust_validation/muon_first_event_canonical_nsb/camera_pixels.csv
output.summary_csv=run_logs/trust_validation/muon_first_event_canonical_nsb/trace_summary.csv
output.mirror_diagnostic_csv=run_logs/trust_validation/muon_first_event_canonical_nsb/mirror_diagnostic.csv

output.lact_root_enabled=true
output.lact_root_path=run_logs/trust_validation/muon_first_event_canonical_nsb/lact_events.root
output.lact_profile=debug_full
output.lact_root_write_components=true

waveform.enabled=true
waveform.source=pe
waveform.time_reference=image_first
waveform.time_bin_width_ns=2
waveform.time_window_start_ns=-2
waveform.time_window_end_ns=60

trigger.pixel_threshold_pe=10
trigger.camera_coincidence_window_ns=20
trigger.array_coincidence_window_ns=0

collector.debug_photon_output=true
collector.debug_photon_csv=run_logs/trust_validation/muon_first_event_canonical_nsb/collector_photons.csv
collector.debug_max_photons=100000

atmosphere.height_histogram_csv=run_logs/trust_validation/muon_first_event_canonical_nsb/atmosphere_height_histogram.csv
atmosphere.histogram_min_altitude_km=4.4
atmosphere.histogram_max_altitude_km=100
atmosphere.histogram_bin_width_km=1
