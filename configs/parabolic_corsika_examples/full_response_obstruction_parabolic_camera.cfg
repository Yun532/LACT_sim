# 6 m circular parabolic mirror, full-response CORSIKA camera test.
#
# Purpose:
#   EventIO photons -> 6 m parabolic mirror -> 3D obstruction ->
#   new_camera pixels + collector -> wavelength efficiency/PDE -> p.e. waveform.
# NSB is disabled here so the timing histogram and GIF show only Cherenkov signal.
telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70

mirror.config=../mirrors/mirror_6m_parabolic.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/new_camera_sipm.cfg
efficiency.config=../efficiency/curves_all.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/example_simple_multiplicity.cfg
obstruction.config=../obstructions/raytrace_final_structure.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.eventio_coordinate_frame=corsika_iact
# Treat 2D EventIO photon positions as recorded on the default local z=0 plane.
source.eventio_2d_input_plane_z_m=0
source.eventio_2d_plane_mode=auto

propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/parabolic_corsika_examples/full_response_obstruction/camera_full_response_obstruction_dense.h5
output.hdf5_storage=dense
output.hdf5_write_components=true
# Keep all telescope images for inspection. Set true if you only want triggered images.
output.save_only_triggered=false
output.write_pixel_time_stats=true

waveform.enabled=true
waveform.source=pe
waveform.time_reference=image_first
waveform.time_bin_width_ns=1
waveform.time_window_start_ns=-5
waveform.time_window_end_ns=20

# Same small non-calibrated random-error smoke settings as the parabolic suite.
# No 1229 elevation structural-deformation series is used for the parabolic mirror.
error.random_seed=987654321
error.facet_radial_position_sigma_m=0.002
error.facet_normal_sigma_deg=0.01
error.reflect_direction_sigma_deg=0.0179
error.radius_of_curvature_sigma_m=0.02
error.reflectivity_scale_sigma=0.02

trigger.pixel_threshold_pe=10
