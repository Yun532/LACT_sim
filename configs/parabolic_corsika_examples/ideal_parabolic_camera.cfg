# 6 m circular parabolic mirror, ideal CORSIKA camera test.
#
# Purpose:
#   EventIO photons -> 6 m parabolic mirror -> new_camera pixels.
#   The optical chain is otherwise ideal, but the MODTRAN atmosphere table is
#   enabled so the EventIO photons carry the same atmospheric transmission
#   treatment as the full-response example. The plotted waveform still uses
#   photon_count rather than p.e.
telescope.config=../official_tests/telescope_1229_minimal.cfg
telescope.pointing_az_deg=0
telescope.pointing_el_deg=70

mirror.config=../mirrors/mirror_6m_parabolic.cfg
output.config=../outputs/focal_plane_f8.cfg
camera.config=../cameras/new_camera.cfg
sipm.config=../sipm/ideal_sipm.cfg
efficiency.config=../efficiency/ideal.cfg
atmosphere.config=../atmosphere/modtran_4400_desert.cfg
nsb.config=../nsb/ideal.cfg
trigger.config=../trigger/disabled.cfg

source.mode=EventIO
source.eventio_path=
source.event_id_mode=event_array100
source.eventio_coordinate_frame=corsika_iact
source.missing_wavelength_model=cherenkov
# Treat 2D EventIO photon positions as recorded on the default local z=0 plane.
source.eventio_2d_input_plane_z_m=0
source.eventio_2d_plane_mode=auto

propagation.speed_of_light_m_per_ns=0.299792458

output.format=hdf5
output.hdf5_path=run_logs/parabolic_corsika_examples/ideal/camera_ideal_dense.h5
output.hdf5_storage=dense
output.hdf5_write_components=false
output.save_only_triggered=false
output.write_pixel_time_stats=true

waveform.enabled=true
waveform.source=photon_count
waveform.time_reference=image_first
waveform.time_bin_width_ns=1
waveform.time_window_start_ns=-5
waveform.time_window_end_ns=20
