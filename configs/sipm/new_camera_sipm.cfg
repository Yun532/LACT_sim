# new_camera SiPM 几何配置。
# size_m 是 SiPM 有效面边长，单位 m。
# S17351 active-array bounding box: 2 x 6.6 mm channels plus one
# 0.2 mm channel gap, and 4 x 3.2 mm channels plus three 0.2 mm gaps.
size_m=0.0134

# SiPM photon detection efficiency.
# Can be a constant, none/off, or a CSV with columns: wavelength_nm, efficiency.
pde=configs/efficiency/sipm_pde.csv
