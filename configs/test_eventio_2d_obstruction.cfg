# Regression test for signed-line PhotonCsv/EventIO 2D obstruction tracing.
# The CSV anchor is downstream of the mirror. The obstruction is upstream, so
# only a physical incoming-ray check can find it.
mirror.mode=generated

dish.type=DaviesCotton
dish.telescope_focal_length=5.0
dish.dish_shape_length=5.0
dish.dish_radius=2.0
dish.vertex=0,0,0

facet.spacing=0.55
facet.radius=0.22
facet.aperture_shape=Circular
facet.surface_type=Spherical

source.mode=PhotonCsv
source.csv_path=configs/sources/photon_csv_eventio_2d_obstruction_test.csv
source.coordinate_frame=telescope_local
source.eventio_2d=true
source.eventio_reference_z_m=0
source.eventio_2d_plane_mode=auto
source.wavelength_nm=400
source.time_ns=0
source.photon_weight=1
source.multiplicity=1

output.plane_point=0,0,5
output.plane_normal=0,0,1
output.mode=pixel

obstruction.enabled=true
obstruction.mode=primitives
obstruction.primitives_csv=configs/obstructions/eventio_2d_upstream_test.csv
obstruction.check_incoming=true
obstruction.check_reflected=true
