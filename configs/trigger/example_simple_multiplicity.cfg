# Example simple multiplicity trigger.
# Camera trigger: at least camera_multiplicity pixels above pixel_threshold_pe.
# Array trigger: at least array_multiplicity camera triggers. Count-only mode
# is the safe default for inputs that do not carry array/shower geometry.
enabled=true
pixel_threshold_pe=5
camera_multiplicity=3
array_multiplicity=2
camera_coincidence_window_ns=20
array_coincidence_window_ns=0
array_time_correction=none
array_wavefront_speed_m_per_ns=0

# EventIO plane-wave timing example:
# array_coincidence_window_ns=50
# array_time_correction=plane_wave
