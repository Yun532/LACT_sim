# Example simple multiplicity trigger.
# Camera trigger: at least camera_multiplicity pixels above pixel_threshold_pe.
# Array trigger: at least array_multiplicity camera triggers. Raw inter-telescope
# timing is disabled until geometric delay compensation is available.
enabled=true
pixel_threshold_pe=5
camera_multiplicity=3
array_multiplicity=2
camera_coincidence_window_ns=20
array_coincidence_window_ns=0
