scene.addEventListener("contextmenu",function(e){e.preventDefault()});scene.addEventListener("pointerdown",function(e){drag=true;dragMode=e.shiftKey||e.button===1||e.button===2?"pan":"rotate";lastX=e.clientX;lastY=e.clientY;scene.setPointerCapture(e.pointerId)});scene.addEventListener("pointerup",function(){drag=false});scene.addEventListener("pointercancel",function(){drag=false});scene.addEventListener("pointermove",function(e){if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(dragMode==="pan"){panX+=dx*devicePixelRatio;panY+=dy*devicePixelRatio}else{viewAzDeg=(viewAzDeg-dx*.25+360)%360;viewElDeg=Math.max(-89.9,Math.min(89.9,viewElDeg-dy*.2))}lastX=e.clientX;lastY=e.clientY;draw()});scene.addEventListener("wheel",function(e){e.preventDefault();const r=scene.getBoundingClientRect(),mx=(e.clientX-r.left)*devicePixelRatio,my=(e.clientY-r.top)*devicePixelRatio;zoomAt(zoom*Math.exp(-e.deltaY*.0015),mx,my)},{passive:false});scene.addEventListener("dblclick",resetView);
function resize(){scene.width=Math.round(innerWidth*devicePixelRatio);scene.height=Math.round(innerHeight*devicePixelRatio);if(page!=="global")cameraDraw();if(page==="elevation")deformChart();draw()}addEventListener("resize",resize);document.querySelectorAll("[data-page]").forEach(function(x){x.classList.toggle("active",x.dataset.page===page)});if(page==="corsika")$("#cameraScale").value="full";$("#cameraCoords").style.display=page==="corsika"?"inline-block":"none";$("#cameraCoords").addEventListener("change",cameraDraw);resize();resetView();update();
</script>
</body>
</html>
